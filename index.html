  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f7f6f3;
    --bg-tertiary: #f1f0ec;
    --text: #1a1a18;
    --text-secondary: #5c5c58;
    --text-tertiary: #9e9d99;
    --border: rgba(0,0,0,0.08);
    --border-med: rgba(0,0,0,0.13);
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --red: #E24B4A;
    --red-light: #FCEBEB;
    --red-text: #A32D2D;
    --amber: #EF9F27;
    --amber-light: #FAEEDA;
    --amber-text: #633806;
    --blue: #378ADD;
    --blue-light: #E6F1FB;
    --blue-text: #0C447C;
    --radius: 10px;
    --radius-sm: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg-secondary: #242422;
      --bg-tertiary: #161614;
      --text: #f0ede8;
      --text-secondary: #a8a6a0;
      --text-tertiary: #6a6864;
      --border: rgba(255,255,255,0.07);
      --border-med: rgba(255,255,255,0.13);
      --green-light: #04342C;
      --red-light: #501313;
      --red-text: #F09595;
      --amber-light: #412402;
      --amber-text: #FAC775;
      --blue-light: #042C53;
      --blue-text: #85B7EB;
    }
  }

  html, body { height: 100%; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-tertiary);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  /* HEADER */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: 48px;
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .header-brand { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); }
  .header-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .header-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-tertiary); }

  /* LAYOUT */
  .layout {
    display: grid;
    grid-template-columns: 255px 1fr;
    height: 100vh;
    padding-top: 48px;
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--bg);
    border-right: 0.5px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border-med); border-radius: 2px; }

  .sb-section { padding: 12px; border-bottom: 0.5px solid var(--border); }
  .sb-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-tertiary);
    margin-bottom: 8px; padding: 0 2px;
  }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; }

  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    border: 0.5px solid var(--border-med);
    background: transparent; color: var(--text-secondary);
    cursor: pointer; transition: all 0.12s; font-family: 'DM Sans', sans-serif;
  }
  .pill:hover { background: var(--bg-secondary); }
  .pill.p-all.on { background: var(--green); border-color: var(--green); color: #fff; }
  .pill.p-actnow.on { background: var(--red); border-color: var(--red); color: #fff; }
  .pill.p-warm.on { background: var(--amber); border-color: var(--amber); color: #fff; }
  .pill.p-watch.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .pill.p-ae.on { background: var(--bg-secondary); border-color: var(--border-med); color: var(--text); font-weight: 500; }

  .sb-accts-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-tertiary);
    padding: 10px 14px 4px;
  }

  .acct-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 14px; cursor: pointer;
    border-bottom: 0.5px solid var(--border);
    transition: background 0.1s;
    border-left: 2px solid transparent;
  }
  .acct-item:hover { background: var(--bg-secondary); }
  .acct-item.selected { background: var(--bg-secondary); border-left-color: var(--green); }
  .acct-item.hidden { display: none; }

  .acct-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot-actnow { background: var(--red); }
  .dot-warm { background: var(--amber); }
  .dot-watch { background: var(--blue); }

  .acct-name { font-size: 12.5px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acct-ae-tag { font-size: 10.5px; color: var(--text-tertiary); flex-shrink: 0; }

  .main {
    overflow-y: auto;
    padding: 20px;
    background: var(--bg-tertiary);
  }
  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-thumb { background: var(--border-med); border-radius: 2px; }

  .welcome {

    color: var(--text-tertiary); text-align: center; gap: 10px;
  }
  .welcome svg { opacity: 0.2; }
  .welcome p { font-size: 13px; }

  /* ACCOUNT VIEW */
  .acct-view { display: none; animation: fadeIn 0.2s ease; }
  .acct-view.visible { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ACCOUNT HEADER CARD */
  .acct-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;

  .acct-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
  .acct-card-name { font-size: 19px; font-weight: 500; color: var(--text); }
  .acct-card-meta { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

  .badge {

    border-radius: 20px; white-space: nowrap; flex-shrink: 0;

  .badge-actnow { background: var(--red-light); color: var(--red-text); }
  .badge-warm { background: var(--amber-light); color: var(--amber-text); }
  .badge-watch { background: var(--blue-light); color: var(--blue-text); }

  .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .stat {
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);

  .stat-label { font-size: 10px; color: var(--text-tertiary); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-val { font-size: 19px; font-weight: 500; font-family: 'DM Mono', monospace; color: var(--text); }
  .stat-val.small { font-size: 13px; padding-top: 3px; }

  /* PANELS */
  .panel {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 18px;
    margin-bottom: 14px;
  }
  .panel-title {
    font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--text-tertiary);
    margin-bottom: 12px; display: flex; align-items: center; gap: 6px;

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 0; }
  .two-col .panel { margin-bottom: 0; }

  /* INTENT */
  .intent-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 0.5px solid var(--border); }
  .intent-row:last-child { border-bottom: none; }
  .intent-kw { font-size: 12px; color: var(--text-secondary); }
  .intent-right { display: flex; align-items: center; gap: 8px; }
  .intent-bar-bg { width: 80px; height: 3px; background: var(--border-med); border-radius: 2px; }
  .intent-bar-fill { height: 3px; border-radius: 2px; }
  .intent-score { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-tertiary); width: 30px; text-align: right; }

  /* PEOPLE */
  .person-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; border-bottom: 0.5px solid var(--border); }
  .person-row:last-child { border-bottom: none; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--blue-light); color: var(--blue-text);
    display: flex; align-items: center; justify-content: center;

  .person-title { font-size: 11px; color: var(--text-tertiary); }
  .no-contacts { font-size: 12px; color: var(--text-tertiary); padding: 4px 0; }

  /* NEWS */
  .news-loading { display: flex; align-items: center; gap: 8px; color: var(--text-tertiary); font-size: 12.5px; padding: 6px 0; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid var(--border-med);
    border-top-color: var(--green);
    animation: spin 0.75s linear infinite; flex-shrink: 0;

  @keyframes spin { to { transform: rotate(360deg); } }

  .news-item { padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .news-item:last-child { border-bottom: none; }
  .news-headline { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 3px; }
  .news-meta { font-size: 11px; color: var(--text-tertiary); }
  .news-signal { font-size: 11.5px; color: var(--green); margin-top: 4px; font-style: italic; }
  .news-error { font-size: 12.5px; color: var(--text-tertiary); padding: 6px 0; }

  /* ACTIONS */
  .action-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
  .action-item:last-child { border-bottom: none; }
  .action-icon {
    width: 26px; height: 26px; border-radius: var(--radius-sm);
    background: var(--bg-secondary); display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; margin-top: 1px;

  .action-text { font-size: 12.5px; color: var(--text); line-height: 1.55; }

  /* CONTEXT */
  .context-tag {
    display: inline-block; font-size: 10.5px; font-weight: 500;
    background: var(--blue-light); color: var(--blue-text);
    padding: 2px 8px; border-radius: 4px; margin-bottom: 8px;
  }
  .context-body { font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; }

  /* LAST UPDATED */
  .last-updated { font-size: 10.5px; color: var(--text-tertiary); margin-top: 20px; text-align: right; padding-bottom: 10px; }
</style>
</head>

// Filter state
let sigFilter = 'all';
let aeFilter = 'all';

function setSig(val, btn) {
  sigFilter = val;
  document.querySelectorAll('.pill.p-all,.pill.p-actnow,.pill.p-warm,.pill.p-watch').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  applyFilters();
}

function setAE(val, btn) {
  aeFilter = val;
  document.querySelectorAll('.pill.p-ae').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  applyFilters();
}

function applyFilters() {
  document.querySelectorAll('.acct-item').forEach(el => {
    const sigOk = sigFilter==='all' || el.dataset.signal===sigFilter;
    const aeOk = aeFilter==='all' || el.dataset.ae===aeFilter;
    el.classList.toggle('hidden', !(sigOk && aeOk));
  });
}

// News cache
const newsCache = {};

async function fetchNews(acct) {
  const loadEl = document.getElementById('nl-'+acct.id);
  const contEl = document.getElementById('nc-'+acct.id);
  if (newsCache[acct.id]) { renderNews(acct.id, newsCache[acct.id]); return; }
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        system:`You are a B2B ABM analyst at Birdeye. Today is ${TODAY}. Search for the 2-3 most recent and relevant news items about the company provided. For each item return: headline (under 12 words), source, approximate date, and a 1-sentence ABM signal explaining why it matters for Birdeye outreach. Return ONLY a valid JSON array with no markdown, no preamble, no code fences. Schema: [{"headline":"...","source":"...","date":"...","signal":"..."}]`,
        messages:[{role:"user",content:`Find recent news about ${acct.name} (${acct.industry} industry) relevant to B2B SaaS outreach. JSON only.`}]
      })
    });
    const data = await res.json();
    const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    const clean = text.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(clean);
    newsCache[acct.id] = parsed;
    renderNews(acct.id, parsed);
  } catch(e) {
    loadEl.style.display='none';
    contEl.style.display='block';
    contEl.innerHTML=`<p class="news-error">Could not load news for ${acct.name}. Check manually or retry.</p>`;
  }
}

function renderNews(id, items) {
  document.getElementById('nl-'+id).style.display='none';
  const el = document.getElementById('nc-'+id);
  el.style.display='block';
  if (!items||!items.length){ el.innerHTML='<p class="news-error">No recent news found.</p>'; return; }
  el.innerHTML = items.map(n=>`
    <div class="news-item">
      <div class="news-headline">${n.headline}</div>
      <div class="news-meta">${n.source}&nbsp;·&nbsp;${n.date}</div>
      ${n.signal?`<div class="news-signal">${n.signal}</div>`:''}
    </div>
  `).join('');
}

let currentId = null;

function selectAcct(id) {
  if (currentId) {
    document.getElementById('v-'+currentId)?.classList.remove('visible');
    document.getElementById('li-'+currentId)?.classList.remove('selected');
  }
  document.getElementById('welcome').style.display='none';
  document.getElementById('v-'+id)?.classList.add('visible');
  document.getElementById('li-'+id)?.classList.add('selected');
  currentId = id;
  const acct = ACCTS.find(a=>a.id===id);
  if (acct) fetchNews(acct);
}
